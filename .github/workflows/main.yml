name: Automate Comment Changes in styles.css

on:
  workflow_dispatch:
  schedule:
    # Run the workflow every hour (adjust as needed)
    - cron: "0 * * * *"

jobs:
  modify-file:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.9"

      # Run the script to modify styles.css
      - name: Modify styles.css
        run: |
          import random
          import time

          file_path = 'crud/static/css/styles.css'

          # Open the file and read content
          with open(file_path, 'r') as file:
              lines = file.readlines()

          # Randomly decide to add or remove comments
          action = random.choice(['add', 'remove'])

          if action == 'add':
              # Generate a random comment
              random_line = random.randint(0, len(lines))
              comment = f'/* Random comment: {time.time()} */\n'
              lines.insert(random_line, comment)

          elif action == 'remove' and '/*' in ''.join(lines):
              # Find comment lines
              comment_lines = [i for i, line in enumerate(lines) if line.strip().startswith('/*')]
              if comment_lines:
                  random_line = random.choice(comment_lines)
                  lines.pop(random_line)

          # Write back to the file
          with open(file_path, 'w') as file:
              file.writelines(lines)

      # Commit and push changes
      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git commit -m "Random comment modification in styles.css"
          git push
